[project]
name = "hospital-management-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hrishikesh", email = "hrishid15@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.142.2",
    "pandas>=3.0.6",
